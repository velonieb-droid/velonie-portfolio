name: SEO AEO Refresh

on:
  push:
    paths:
      - '.github/workflows/seo-aeo-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run SEO and AEO refresh
        run: python tools/seo_aeo_refresh.py
      - name: Commit SEO and AEO improvements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve portfolio SEO AEO and service positioning"
          git push

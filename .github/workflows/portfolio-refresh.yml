name: Portfolio Refresh

on:
  push:
    paths:
      - '.github/workflows/portfolio-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run portfolio refresh
        run: python tools/portfolio_refresh.py
      - name: Commit homepage improvements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Improve portfolio conversion copy and case studies"
          git push
